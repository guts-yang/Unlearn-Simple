model_family: llama2-7b
# Download origin weights into the data-disk HF cache first:
#   source /root/autodl-tmp/env_hf.sh && hf download locuslab/tofu_ft_llama2-7b
# Do not set a HuggingFace repo id here: forget.py uses os.listdir(model_path).
# The cache snapshot dir is a valid local dir; re-read the hash after re-downloading:
#   ls -d $HF_HOME/hub/models--locuslab--tofu_ft_llama2-7b/snapshots/*/
model_path: /root/autodl-tmp/huggingface/hub/models--locuslab--tofu_ft_llama2-7b/snapshots/8fa500e8f345f1dd9cfe95bb4689878c944c9cbd

LoRA:
  r: 0
  alpha: 32
  dropout: 0.05

lr: 1e-5

split: forget05
retain_set: retain95
batch_size: 1
# 2 GPUs: 1 * 16 * 2 = 32 global batch (same as paper 1 * 4 * 8)
gradient_accumulation_steps: 16
num_epochs: 10
forget_loss: simnpo_grad_diff

npo_coeff: 0.1375
grad_diff_coeff: 1.0
KL_coeff: 1.0
ref_policy: fine_tuned
beta: 2.5
gamma: 0.0
weight_decay: 0.01

seed: 1001
run_index: 1
overwrite_dir: false
# If set, skip training and only evaluate this unlearned checkpoint
# (oracle / retain KL still uses model_path = original ft weights).
eval_checkpoint: null
eval_steps: steps_per_epoch
warmup_steps: steps_per_epoch

# Data disk (system disk is only 30GB). Must NOT be under model_path: that would
# write checkpoints into the HuggingFace cache snapshot.
save_dir: /root/autodl-tmp/TOFU_results/2GPU_${forget_loss}_${lr}_${split}_epoch${num_epochs}_batch${batch_size}_accum${gradient_accumulation_steps}_beta${beta}_gamma${gamma}_grad_diff_coeff${grad_diff_coeff}_ref${ref_policy}_eval${eval_steps}_seed${seed}_${run_index}

eval:
  retain_result: data/${..retain_set}_llama_wd0.01/eval_results/ds_size300/eval_log_aggregated.json
  model_path: ${..model_path}
  model_family: ${..model_family}
  save_dir: ${..save_dir}
  aggr_save_dir: ${..aggr_save_dir}
  data_path: [locuslab/TOFU, locuslab/TOFU, locuslab/TOFU, locuslab/TOFU]
  split: ${..split}_perturbed
  split_list:
    - retain_perturbed
    - real_authors_perturbed
    - world_facts_perturbed
    - ${split}

  eval_task: [eval_log, eval_real_author_wo_options, eval_real_world_wo_options, eval_log_forget]
  question_key: [question, question, question, question]
  answer_key: [answer, answer, answer, answer]
  base_answer_key: [paraphrased_answer, answer, answer, paraphrased_answer]
  perturbed_answer_key: [perturbed_answer, perturbed_answer, perturbed_answer, perturbed_answer]

  generation:
    max_length: 200
    max_new_tokens: null

  save_generated_text: true

  ds_size: 300

  overwrite: true
  use_pretrained: false

  # Lowered from 30 for 2x80GB peak-memory safety during evaluate()
  batch_size: 8
